
models:
  - name: marts
    description: completed test on customer , date , geography and product marts

    columns:
      - name: row_id
        tests:
          - unique
          - not_null

      - name: order_id
        tests:
          - not_null

      - name: order_date
        tests:
          - not_null

      - name: sales
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null
      
      - name: product_id
        tests:
          - not_null
          
